name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter platform files
        run: flutter create . --platforms=android --org=com.whereweare --project-name=whereweare

      - name: Icon, splash, permissions and Maps key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: bash scripts/polish.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          DEFS=""
          if [ -n "$MAPS_API_KEY" ]; then DEFS="--dart-define=MAPS_ENABLED=true"; fi
          flutter build apk --release --dart-define=USE_FIREBASE=false $DEFS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whereweare-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
